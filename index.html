<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Power of Sequencing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Newsreader:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>The life of a flower🌺</h1>
  </header>

  <div class="buttons">
    <button id="btnA" class="active">Version A</button>
    <button id="btnB">Version B</button>
  </div>

  <main>

    <section class="frames">
      <figure class="frame">
        <img id="img1" src="images/image1.jpg" alt="Seed">
        <figcaption>
          <p class="stage" id="stage1">Beginning</p>
          <h3 class="name" id="name1">Seed</h3>
          <p class="cap" id="cap1">It is a small seed. Everything starts here.🍃</p>
        </figcaption>
      </figure>

      <figure class="frame">
        <img id="img2" src="images/image2.jpg" alt="Blooming Flower">
        <figcaption>
          <p class="stage" id="stage2">Middle</p>
          <h3 class="name" id="name2">Blooming Flower</h3>
          <p class="cap" id="cap2">The seed grows and the flower is beautiful.🌸</p>
        </figcaption>
      </figure>

      <figure class="frame">
        <img id="img3" src="images/image3.jpg" alt="Withered Flower">
        <figcaption>
          <p class="stage" id="stage3">End</p>
          <h3 class="name" id="name3">Withered Flower</h3>
          <p class="cap" id="cap3">The flower dies. This is how life goes.</p>
        </figcaption>
      </figure>
    </section>


  </main>

  <script src="script.js"></script>
</body>
</html>
